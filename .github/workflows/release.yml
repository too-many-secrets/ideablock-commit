name: release

# Cross-compiles the Go port (ports/go) into standalone binaries and attaches
# them to the GitHub Release whenever a version tag is pushed, e.g.:
#
#   git tag v2.0.0 && git push origin v2.0.0
#
# This backs the "GitHub Releases — download the latest binary" option on the
# Ideablock commits page. The Go port has no third-party deps, so the binaries
# are self-contained (no Node/runtime required).
#
# It also bumps the Homebrew formula, because nothing else did. The tap sat
# three versions behind for weeks and served the build with the random parity
# digit from the commits page, next to npm, as an equal option. Anything a
# signup page offers has to be released by the same act that releases
# everything else, or it drifts silently and you find out from a user.

on:
  push:
    tags:
      - "v*"
  # Manual re-run, for bumping the tap without cutting a release — a formula
  # that has drifted needs a way back into line that is not "invent a version".
  workflow_dispatch:
    inputs:
      version:
        description: "npm version to point the Homebrew formula at (e.g. 3.1.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    # Binaries belong to a tag. A manual run is for the formula only.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binary
        working-directory: ports/go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          IDEABLOCK_API_URL: "https://app.ideablock.com"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="ideablock-commit-${GOOS}-${GOARCH}${ext}"
          # -X main.defaultAPI is not optional. Without it the binary keeps its
          # source default, and a downloaded release points at a server on the
          # user's own machine — the tool would appear broken on first run for
          # everyone who is not us.
          go build -trimpath \
            -ldflags="-s -w -X main.defaultAPI=${IDEABLOCK_API_URL}" \
            -o "$out" .
          echo "ASSET=ports/go/$out" >> "$GITHUB_ENV"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true

  # ── Homebrew ──────────────────────────────────────────────────────────────
  #
  # Runs after the binaries so a failed build never publishes a formula for a
  # release that does not exist.
  #
  # The formula points at the npm tarball, which is published by hand and may
  # not exist yet when the tag lands. So this waits for it rather than assuming
  # an order, and fails loudly if it never appears — a stale formula is the
  # thing this job exists to prevent, so it must not exit quietly.
  homebrew:
    needs: build
    # always() so a manual run reaches this job at all — build is skipped then,
    # and a skipped dependency would otherwise skip this too. The explicit
    # success check keeps a failed build from publishing a formula for a
    # release that does not exist.
    if: |
      always() &&
      (needs.build.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Wait for the npm tarball, then hash it
        run: |
          url="https://registry.npmjs.org/ideablock-commit/-/ideablock-commit-${VERSION}.tgz"
          for attempt in $(seq 1 30); do
            if curl -sfL --max-time 30 "$url" -o pkg.tgz; then
              echo "npm has ${VERSION} (attempt ${attempt})"
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "::error::ideablock-commit@${VERSION} never appeared on npm after 15 minutes."
              echo "::error::Tag and publish go together — run 'npm publish', then re-run this job."
              exit 1
            fi
            sleep 30
          done
          # Verify it is the version claimed, not a redirect or an error page
          # saved as a file: a wrong sha256 breaks brew install for everyone.
          got=$(tar -xzOf pkg.tgz package/package.json | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' | head -1)
          if [ "$got" != "$VERSION" ]; then
            echo "::error::tarball reports version ${got}, expected ${VERSION}"
            exit 1
          fi
          echo "SHA256=$(sha256sum pkg.tgz | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: too-many-secrets/homebrew-tap
          # GITHUB_TOKEN only reaches this repository. Pushing to the tap needs
          # a PAT with contents:write on it, stored as HOMEBREW_TAP_TOKEN.
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Bump the formula
        working-directory: tap
        run: |
          f=Formula/ideablock-commit.rb
          sed -i "s|ideablock-commit-[0-9.]*\.tgz|ideablock-commit-${VERSION}.tgz|" "$f"
          sed -i "s|sha256 \"[0-9a-f]\{64\}\"|sha256 \"${SHA256}\"|" "$f"
          if git diff --quiet; then
            echo "formula already at ${VERSION} — nothing to do"
            exit 0
          fi
          grep -E 'url|sha256' "$f"
          git config user.name  "Eli Sheets"
          git config user.email "eli.sheets@gmail.com"
          git commit -qam "ideablock-commit ${VERSION}

          Bumped by the release workflow from tag ${GITHUB_REF_NAME}.
          sha256 verified against the published npm tarball."
          git push
